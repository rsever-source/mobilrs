# Cloud Build: build + push + trafiksiz deploy + smoke test + otomatik canlıya geçiş.
# Ana sayfa ve /api/news testi başarılı olmazsa build kırmızı kalır ve canlı trafik değişmez.
# Test başarılıysa en son revision'a trafik aktarılır.
steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - --no-cache
      - -t
      - europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$COMMIT_SHA
      - .
      - -f
      - Dockerfile

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - mobilrs-test
      - --platform=managed
      - --image=europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$COMMIT_SHA
      - --region=europe-west1
      - --no-traffic
      - --tag=test
      - --update-secrets=ADMIN_PASSWORD=ADMIN_PASSWORD:latest
      - --quiet

  # Build ve deploy başarılıysa yeni revision'ı doğrudan canlıya al.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: PromoteToLive
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - mobilrs-test
      - --region=europe-west1
      - --project=project-f671a84c-0cde-40b8-921
      - --to-latest
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

# Cloud Build: build + push + trafiksiz deploy + smoke test + doğrulanmış revision'ı canlıya al.
#
# ÖNEMLİ: Her build kendi benzersiz image ve Cloud Run tag'ini kullanır
# (BUILD_ID). Böylece paralel build'ler birbirinin revision'ını seçemez veya
# canlıya alamaz. Trafik yine "latestRevision" yerine ADI BELİRLİ bir revision'a
# sabitlenir:
#   1) Deploy adımı --no-traffic ve build'e özel tag ile revision oluşturur,
#   2) Smoke test yalnızca bu build'in tag URL'i üzerinde çalışır,
#   3) revision adı latestCreatedRevisionName'den değil, bu build'in tag'inden
#      okunur,
#   4) yalnızca smoke test geçerse o revision adıyla %100'e alınır.
# Herhangi bir adım başarısız olursa canlı trafik mevcut revision'da kalır.
#
# Cloud Run, trafik tag'i ile servis adının toplamının 46 karakteri geçmesine
# izin vermez. Bu yüzden tag, BUILD_ID'nin ilk 20 karakteriyle üretilir:
# "test-" + 20 = 25 karakter; "mobilrs-test" (12) ile toplam 37 <= 46.
#
# Not: adım içindeki shell değişkenleri $$ ile yazılır; tek $ Cloud Build
# substitution olarak yorumlanır ve build reddedilir.
steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - --no-cache
      - -t
      - europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$COMMIT_SHA
      - -t
      - europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$BUILD_ID
      - .
      - -f
      - Dockerfile

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - --all-tags
      - europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: bash
    env:
      - 'BUILD_ID=$BUILD_ID'
    args:
      - -c
      - |
        set -euo pipefail
        TAG="test-$${BUILD_ID:0:20}"
        for attempt in 1 2 3 4 5; do
          if gcloud run services update mobilrs-test \
            --platform=managed \
            --image=europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$BUILD_ID \
            --region=europe-west1 \
            --no-traffic \
            --tag="$$TAG" \
            --update-secrets=ADMIN_PASSWORD=ADMIN_PASSWORD:latest \
            --quiet; then
            echo "Revision deployed with tag $$TAG"
            exit 0
          fi
          echo "Deploy conflict; retrying ($$attempt/5)..."
          sleep $$((attempt * 5))
        done
        echo "HATA: deploy 5 denemede tamamlanamadi." >&2
        exit 1

  # Bu build'in oluşturduğu revision adını ve tag URL'ini dosyaya yaz.
  # Revision, servisin global latestCreatedRevisionName alanından DEĞİL, yalnızca
  # bu build'e ait benzersiz tag'den okunur.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: CaptureRevision
    entrypoint: bash
    env:
      - 'BUILD_ID=$BUILD_ID'
    args:
      - -c
      - |
        set -euo pipefail
        TAG="test-$${BUILD_ID:0:20}"
        SERVICE="mobilrs-test"
        REGION="europe-west1"
        PROJECT="project-f671a84c-0cde-40b8-921"

        # Cloud Run traffic hedefini tag alanindan bul.
        # Not: "gcloud run services describe" --flatten/--filter DESTEKLEMEZ
        # ("unrecognized arguments"), --format icindeki filter() de calismaz
        # ("Transform function expected"). Bu yuzden tam JSON alinir ve her
        # traffic girdisi tek satira indirilir; tag eslesmesi tirnakli desenle
        # yapilir ('test' etiketi 'test-abc...' ile karismaz).
        # Yalnizca status.traffic blogu alinir; spec.traffic de ayni tag'leri
        # tasidigi icin tum JSON kullanilirsa her tag iki kez eslesir.
        TRAFIK="$$(gcloud run services describe "$$SERVICE" \
          --region="$$REGION" \
          --project="$$PROJECT" \
          --format=json \
          | tr -d '\n' \
          | sed -n 's/.*"status":[[:space:]]*{.*"traffic":[[:space:]]*\(\[[^]]*\]\).*/\1/p' \
          | sed 's/}[[:space:]]*,[[:space:]]*{/}\n{/g')"

        ESLEME="$$(printf '%s\n' "$$TRAFIK" | grep -F "\"tag\": \"$$TAG\"" || true)"
        if [ "$$(printf '%s\n' "$$ESLEME" | grep -c . || true)" != "1" ]; then
          echo "HATA: $$TAG tag'i tek bir revision'a isaret etmiyor" >&2
          exit 1
        fi

        REVISION="$$(printf '%s\n' "$$ESLEME" | sed -n 's/.*"revisionName": "\([^"]*\)".*/\1/p')"
        BASE="$$(printf '%s\n' "$$ESLEME" | sed -n 's/.*"url": "\([^"]*\)".*/\1/p')"
        if [ -z "$$REVISION" ]; then
          echo "HATA: $$TAG tag'i icin revision adi bulunamadi" >&2
          exit 1
        fi

        # Tag URL'i servis tarafindan dondurulmediyse servis URL'inden turet.
        if [ -z "$$BASE" ]; then
          SERVIS_URL="$$(gcloud run services describe "$$SERVICE" \
            --region="$$REGION" \
            --project="$$PROJECT" \
            --format="value(status.url)")"
          case "$$SERVIS_URL" in
            https://*) ;;
            *)
              echo "HATA: servis URL'i okunamadi" >&2
              exit 1
              ;;
          esac
          BASE="$${SERVIS_URL/https:\/\//https://$$TAG---}"
        fi

        case "$$BASE" in
          "https://$$TAG---"*) ;;
          *)
            echo "HATA: smoke test URL'i bu build'in tag'ine ait degil: $$BASE" >&2
            exit 1
            ;;
        esac

        printf '%s\n' "$$REVISION" > /workspace/revision.txt
        printf '%s\n' "$$BASE" > /workspace/base_url.txt
        echo "revision=$$REVISION"
        echo "base=$$BASE"

  # Canlı trafik değişmeden, bu build'e ait tag URL'i üzerinde gerçek HTTP kontrolü.
  # Python bağımlılığı yok: aynı gcloud imajı üzerinde curl ile çalışır.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: SmokeTest
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        BASE="$$(cat /workspace/base_url.txt)"
        echo "Smoke test: $$BASE"

        # Durum kodu dondurur; baglanti hatasinda 0 (Python surumundeki gibi).
        durum_kodu() {
          curl -s -o /dev/null -m 30 -w '%{http_code}' "$$1" 2>/dev/null || echo 0
        }

        # Govdeyi dondurur; hata durumunda bos.
        govde() {
          curl -s -m 30 "$$1" 2>/dev/null || true
        }

        kontrol() {
          _yol="$$1"
          _beklenen="$$2"
          _url="$$BASE$$_yol"
          _alinan=0
          _deneme=1
          while [ "$$_deneme" -le 10 ]; do
            _alinan="$$(durum_kodu "$$_url")"
            echo "  $$_url -> $$_alinan (deneme $$_deneme)"
            if [ "$$_alinan" = "$$_beklenen" ]; then
              return 0
            fi
            _deneme=$$((_deneme + 1))
            sleep 6
          done
          echo "HATA: $$_url icin beklenen $$_beklenen, alinan $$_alinan" >&2
          exit 1
        }

        # "Yol BeklenenKod" ciftleri.
        # KV-001 artik katalogda yok (mukerrer KV blogu Faz 4'te kaldirildi);
        # yerine ana katalogdan V-001 ve EK-2 ek katalogdan SS-023 kontrol edilir.
        for ikili in "/ 200" "/api/news 200" "/admin/haber-durumu 200" \
                      "/admin/api/status 401" "/arac1 200" "/arac2 200" \
                      "/api/bolumler 200" "/api/ozel-hesaplamalar 200" \
                      "/api/kayit/V-001 200" "/api/kayit/SS-023 200"; do
          kontrol "$${ikili%% *}" "$${ikili##* }"
        done

        # icerir DOSYA METIN
        icerir() {
          grep -qF -- "$$2" "$$1"
        }

        # icermez DOSYA METIN
        icermez() {
          ! grep -qF -- "$$2" "$$1"
        }

        HOME_HTML="/workspace/smoke_home.html"
        ARAC1_HTML="/workspace/smoke_arac1.html"
        ARAC2_HTML="/workspace/smoke_arac2.html"
        BOLUMLER_JSON="/workspace/smoke_bolumler.json"
        OZEL_JSON="/workspace/smoke_ozel.json"

        echo "ADIM: home"
        govde "$$BASE/" > "$$HOME_HTML"
        if ! icerir "$$HOME_HTML" "Hastalık Oranı Bulma" ||
           ! icerir "$$HOME_HTML" "Balthazard Oranı Hesaplama"; then
          echo "HATA: ana sayfada hastalık oranı veya Balthazard araç kartı bulunamadı" >&2
          exit 1
        fi

        echo "ADIM: arac1"
        govde "$$BASE/arac1" > "$$ARAC1_HTML"
        govde "$$BASE/arac2" > "$$ARAC2_HTML"

        echo "ADIM: arac2-gecis"
        if icerir "$$ARAC1_HTML" "Araç-2'ye geç"; then
          echo "HATA: Araç-1 alt eylem alanında gereksiz Araç-2 geçiş düğmesi var" >&2
          exit 1
        fi
        if ! icerir "$$ARAC2_HTML" 'id="sonuc-halka"' ||
           ! icerir "$$ARAC2_HTML" 'id="sonuc-katkilar-listesi"' ||
           ! icerir "$$ARAC2_HTML" 'id="sonucu-indir"'; then
          echo "HATA: Araç-2 sonuç özeti bileşenleri eksik" >&2
          exit 1
        fi

        echo "ADIM: ust-baslik"
        for cift in "Araç-1:$$ARAC1_HTML" "Araç-2:$$ARAC2_HTML"; do
          AD="$${cift%%:*}"
          SAYFA="$${cift##*:}"
          if ! icerir "$$SAYFA" '<header class="site-header" role="banner">' ||
             ! icerir "$$SAYFA" 'class="site-brand" href="/" aria-label="Engelli.me ana sayfa"' ||
             ! icerir "$$SAYFA" 'class="site-mobile-home" href="/">Anasayfa</a>' ||
             ! icerir "$$SAYFA" 'id="siteAccessibilityPanel"'; then
            echo "HATA: $$AD ortak Engelli.me üst başlığı eksik." >&2
            exit 1
          fi
        done

        if ! icerir "$$ARAC1_HTML" '<aside class="sag-panel"'; then
          echo 'HATA: Araç-1 HTML içinde <aside class="sag-panel" bulunamadı' >&2
          exit 1
        fi
        if ! icerir "$$ARAC1_HTML" "</aside>"; then
          echo 'HATA: Araç-1 sağ panelinin kapanış </aside> etiketi bulunamadı' >&2
          exit 1
        fi
        if ! icerir "$$ARAC1_HTML" 'id="sepet"'; then
          echo 'HATA: Araç-1 HTML içinde id="sepet" bulunamadı' >&2
          exit 1
        fi

        echo "ADIM: aside-sinirlari"
        # id="sepet", <aside class="sag-panel"> ile </aside> arasinda olmali.
        ASIDE_BAS="$$(grep -boF '<aside class="sag-panel"' "$$ARAC1_HTML" | head -n1 | cut -d: -f1)"
        SEPET_BAS="$$(grep -boF 'id="sepet"' "$$ARAC1_HTML" | head -n1 | cut -d: -f1)"
        ASIDE_SON_GORE="$$(tail -c +$$((ASIDE_BAS + 1)) "$$ARAC1_HTML" | grep -boF "</aside>" | head -n1 | cut -d: -f1)"
        if [ -z "$$ASIDE_BAS" ] || [ -z "$$SEPET_BAS" ] || [ -z "$$ASIDE_SON_GORE" ]; then
          echo 'HATA: Araç-1 sağ panel sınırları okunamadı' >&2
          exit 1
        fi
        ASIDE_SON=$$((ASIDE_BAS + ASIDE_SON_GORE))
        if [ "$$SEPET_BAS" -le "$$ASIDE_BAS" ] || [ "$$SEPET_BAS" -ge "$$ASIDE_SON" ]; then
          echo 'HATA: id="sepet" sağ panel <aside class="sag-panel"> içinde değil' >&2
          exit 1
        fi

        if icerir "$$ARAC1_HTML" 'id="model-secili-isaretler"'; then
          echo 'HATA: Figürsüz Araç-1 arayüzünde kaldırılmış id="model-secili-isaretler" öğesi hâlâ HTML içinde' >&2
          exit 1
        fi
        if icerir "$$ARAC1_HTML" 'id="listeyi-kopyala"'; then
          echo 'HATA: Eski id="listeyi-kopyala" kopyalama düğmesi hâlâ HTML içinde' >&2
          exit 1
        fi
        if ! icerir "$$ARAC1_HTML" 'id="balthazard-onizleme"' ||
           ! icerir "$$ARAC1_HTML" 'fetch("/api/hesapla"'; then
          echo "HATA: Araç-1 canlı Balthazard ön izlemesi eksik" >&2
          exit 1
        fi

        echo "ADIM: yas-kutusu"
        # 65+ kutusu hem HTML'de hem de istek gövdesinde işlevsel olmalı.
        # DIKKAT: "icerir ... || YAS_TAMAM=0" set -e altinda sessizce cikisa yol
        # aciyordu (grep 1 donunce || ile yakalanan komut da basarisiz sayilir ve
        # echo/exit satirlarina hic ulasilmaz). Bu yuzden her cagri if ile sarilir.
        YAS_TAMAM=1
        for desen in '<section class="model-yas-kontrol"' \
                      '<input id="yas-ek-goster" type="checkbox" aria-describedby="yas-ek-bilgi">' \
                      '65 yaş ve üzeri için %10 yaş ekini uygula' \
                      'var yasEkGoster = document.getElementById("yas-ek-goster");' \
                      'yas: yasEkGoster.checked ? "65_ve_uzeri" : "65_alti"' \
                      'yas_ekle: yasEkGoster.checked'; do
          if ! icerir "$$ARAC1_HTML" "$$desen"; then
            YAS_TAMAM=0
          fi
        done

        # Varsayılan olarak işaretli olmamalı: id="yas-ek-goster" ile ilk ">" arasında "checked" yok.
        # (Python sürümü: arac1.split(b'id="yas-ek-goster"',1)[1].split(b'>',1)[0])
        YAS_ETIKET="$$(sed -n 's/.*id="yas-ek-goster"\([^>]*\)>.*/\1/p' "$$ARAC1_HTML" | head -n1)"
        YAS_VARSAYILAN_KAPALI=0
        if [ -n "$$YAS_ETIKET" ]; then
          case "$$YAS_ETIKET" in
            *checked*) YAS_VARSAYILAN_KAPALI=0 ;;
            *) YAS_VARSAYILAN_KAPALI=1 ;;
          esac
        fi

        echo "ADIM: nav"
        # <nav class="sekmeler"> içinde ">Hakk" olmamalı.
        NAV_HAKK=0
        NAV_IC="$$(sed -n 's/.*<nav class="sekmeler"\(.*\)<\/nav>.*/\1/p' "$$ARAC1_HTML" | head -n1)"
        case "$$NAV_IC" in
          *">Hakk"*) NAV_HAKK=1 ;;
        esac

        if icerir "$$ARAC1_HTML" 'class="insan-model-gorsel"' ||
           icerir "$$ARAC1_HTML" 'id="model-secim-cagri"' ||
           icerir "$$ARAC1_HTML" 'function modeliGuncelle(bolumAdi)' ||
           icerir "$$ARAC1_HTML" '<svg class="insan-svg"' ||
           [ "$$YAS_TAMAM" != "1" ] || [ "$$YAS_VARSAYILAN_KAPALI" != "1" ] ||
           ! icerir "$$ARAC1_HTML" 'id="ozel-hesaplama-kutusu"' ||
           icerir "$$ARAC1_HTML" "v2.0" || [ "$$NAV_HAKK" = "1" ]; then
          echo "HATA: Araç-1 arayüzü beklenen yeni düzende değil veya 65+ kutusu eksik/varsayılan işaretli" >&2
          exit 1
        fi

        echo "ADIM: json-sayilari"
        govde "$$BASE/api/bolumler" > "$$BOLUMLER_JSON"
        govde "$$BASE/api/ozel-hesaplamalar" > "$$OZEL_JSON"
        # /api/bolumler yaniti her bolumde "ad" alanini tasir (kimlik alani yok);
        # /api/ozel-hesaplamalar yaniti her kayitta "id" alanini tasir.
        # Onceki surum ikisinde de "id" aradigi icin bolum sayisi 0 cikiyordu.
        BOLUM_SAYISI="$$(grep -o '"ad"' "$$BOLUMLER_JSON" | wc -l | tr -d ' ' || true)"
        OZEL_SAYISI="$$(grep -o '"id"' "$$OZEL_JSON" | wc -l | tr -d ' ' || true)"
        # Beklenen sayilar veriyle birlikte guncellenir:
        # 16 kategori = 12 sabit oranli bolum + 4 tablo/formul kategorisi
        #              (Goz, Kas-Iskelet, Romatoloji, Yaniklar)
        # 6 ozel hesaplama = OZ-GOR-001, OZ-KIS-001/002/003, OZ-ROM-001, OZ-YAN-001
        if [ "$$BOLUM_SAYISI" != "16" ] || [ "$$OZEL_SAYISI" != "6" ]; then
          echo "HATA: EK-2 katalog veya ozel hesaplama verisi eksik (bolum=$$BOLUM_SAYISI, ozel=$$OZEL_SAYISI)" >&2
          exit 1
        fi

        echo "ADIM: bitti"
        echo "SMOKE OK"

  # Smoke test geçtiyse YALNIZCA bu build'in doğrulanmış revision'ını canlıya al.
  # Eşzamanlı trafik güncellemeleri Cloud Run'da ABORTED dönebilir; aynı revision
  # hedefiyle sınırlı sayıda yeniden denenir.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: PromoteVerifiedRevision
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REV="$$(cat /workspace/revision.txt)"
        echo "Smoke test gecti; trafik $$REV revision'ina aliniyor."
        promoted=0
        for attempt in 1 2 3 4 5; do
          if gcloud run services update-traffic mobilrs-test \
            --region=europe-west1 \
            --project=project-f671a84c-0cde-40b8-921 \
            --to-revisions="$$REV=100" \
            --quiet; then
            promoted=1
            break
          fi
          echo "Trafik guncellemesi cakisti; tekrar deneniyor ($$attempt/5)..."
          sleep $$((attempt * 5))
        done
        if [ "$$promoted" != "1" ]; then
          echo "HATA: trafik 5 denemede guncellenemedi." >&2
          exit 1
        fi

  # %100 trafiğin gerçekten bu build'in revision'ında olduğunu doğrula (bash + gcloud).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: VerifyTraffic
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        REV="$$(cat /workspace/revision.txt)"

        # %100 trafigi alan revision'i bul (ayni JSON ayristirmasi).
        # Ayni sekilde yalnizca status.traffic blogu (spec.traffic haric).
        TRAFIK="$$(gcloud run services describe mobilrs-test \
          --region=europe-west1 \
          --project=project-f671a84c-0cde-40b8-921 \
          --format=json \
          | tr -d '\n' \
          | sed -n 's/.*"status":[[:space:]]*{.*"traffic":[[:space:]]*\(\[[^]]*\]\).*/\1/p' \
          | sed 's/}[[:space:]]*,[[:space:]]*{/}\n{/g')"

        CANLI="$$(printf '%s\n' "$$TRAFIK" \
          | grep -F '"percent": 100' \
          | sed -n 's/.*"revisionName": "\([^"]*\)".*/\1/p' || true)"

        SATIR_SAYISI="$$(printf '%s\n' "$$CANLI" | grep -c . || true)"
        if [ "$$SATIR_SAYISI" != "1" ] || [ "$$CANLI" != "$$REV" ]; then
          echo "HATA: %100 trafik beklenen revision'da degil (beklenen=$$REV, canli=$$CANLI)" >&2
          exit 1
        fi
        echo "TAMAM: %100 trafik $$REV revision'inda."

  # Build'e özel tag'i temizle; başarısız olsa bile canlı trafiği etkilemez.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: CleanupTag
    entrypoint: bash
    env:
      - 'BUILD_ID=$BUILD_ID'
    args:
      - -c
      - |
        set -euo pipefail
        TAG="test-$${BUILD_ID:0:20}"

        # Yalnizca BU build'in kendi test-* etiketi kaldirilir.
        # admin-panel, secret-verify, rgprod, rgtest, test gibi mevcut etiketlere
        # dokunulmaz. Etiket bu serviste yoksa gcloud'u hic cagirmayiz.
        MEVCUT="$$(gcloud run services describe mobilrs-test \
          --region=europe-west1 \
          --project=project-f671a84c-0cde-40b8-921 \
          --format="value(status.traffic[].tag)" \
          | grep -c -x -- "$$TAG" || true)"

        if [ "$$MEVCUT" = "0" ]; then
          echo "Temizlenecek tag yok: $$TAG"
          exit 0
        fi

        gcloud run services update-traffic mobilrs-test \
          --region=europe-west1 \
          --project=project-f671a84c-0cde-40b8-921 \
          --remove-tags="$$TAG" \
          --quiet
        echo "Tag temizlendi: $$TAG"
    allowFailure: true

options:
  logging: CLOUD_LOGGING_ONLY

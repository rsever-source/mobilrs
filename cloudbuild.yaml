# Cloud Build: build + push + trafiksiz deploy + smoke test + doğrulanmış revision'ı canlıya al.
#
# ÖNEMLİ: Servis trafiği "latestRevision" yerine ADI BELİRLİ bir revision'a
# sabitlenmelidir. Trafik latestRevision'a bağlıyken yeni revision oluşturulduğu
# anda %100 trafik alır ve başarısız build bile canlıya çıkar. Bu yüzden:
#   1) Deploy adımı --no-traffic ile revision oluşturur (trafik değişmez),
#   2) Smoke test tag URL'i üzerinde çalışır,
#   3) yalnızca smoke test geçerse o revision adıyla %100'e alınır.
# Herhangi bir adım başarısız olursa canlı trafik mevcut revision'da kalır.
#
# Not: adım içindeki shell değişkenleri $$ ile yazılır; tek $ Cloud Build
# substitution olarak yorumlanır ve build reddedilir.
steps:
  - name: gcr.io/cloud-builders/docker
    id: Build
    args:
      - build
      - --no-cache
      - -t
      - europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$COMMIT_SHA
      - .
      - -f
      - Dockerfile

  - name: gcr.io/cloud-builders/docker
    id: Push
    args:
      - push
      - europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - mobilrs-test
      - --platform=managed
      - --image=europe-west1-docker.pkg.dev/project-f671a84c-0cde-40b8-921/cloud-run-source-deploy/mobilrs-test:$COMMIT_SHA
      - --region=europe-west1
      - --no-traffic
      - --tag=test
      - --update-secrets=ADMIN_PASSWORD=ADMIN_PASSWORD:latest
      - --quiet

  # Bu build'in oluşturduğu revision adını ve tag URL'ini dosyaya yaz.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: CaptureRevision
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        REV="$$(gcloud run services describe mobilrs-test --region=europe-west1 --project=project-f671a84c-0cde-40b8-921 --format='value(status.latestCreatedRevisionName)')"
        URL="$$(gcloud run services describe mobilrs-test --region=europe-west1 --project=project-f671a84c-0cde-40b8-921 --format='value(status.url)')"
        BASE="$$(echo "$$URL" | sed 's#https://#https://test---#')"
        echo "$$REV" > /workspace/revision.txt
        echo "$$BASE" > /workspace/base_url.txt
        echo "revision=$$REV"
        echo "base=$$BASE"

  # Canlı trafik değişmeden, tag URL'i üzerinde gerçek HTTP kontrolü.
  # (Ekstra image çekmemek için gcloud adımıyla aynı image + python3 kullanılır.)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: SmokeTest
    entrypoint: python3
    args:
      - -c
      - |
        import time, urllib.request, urllib.error

        base = open("/workspace/base_url.txt").read().strip()
        print("Smoke test:", base, flush=True)

        def status_code(url):
            try:
                with urllib.request.urlopen(url, timeout=30) as r:
                    return r.status
            except urllib.error.HTTPError as e:
                return e.code
            except Exception as e:
                print("  hata:", e, flush=True)
                return 0

        def check(path, want):
            url = base + path
            got = 0
            for attempt in range(10):
                got = status_code(url)
                print("  %s -> %s (deneme %d)" % (url, got, attempt + 1), flush=True)
                if got == want:
                    return
                time.sleep(6)
            raise SystemExit("HATA: %s icin beklenen %s, alinan %s" % (url, want, got))

        for path, want in (("/", 200), ("/api/news", 200),
                           ("/admin/haber-durumu", 200), ("/admin/api/status", 401)):
            check(path, want)

        body = urllib.request.urlopen(base + "/admin/haber-durumu", timeout=30).read()
        if b"Engelli.me" not in body:
            raise SystemExit("HATA: yonetim sayfasi beklenen icerigi dondurmedi")
        print("SMOKE OK", flush=True)

  # Smoke test geçtiyse YALNIZCA bu revision'ı canlıya al (latestRevision'a dönme).
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: PromoteVerifiedRevision
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        REV="$$(cat /workspace/revision.txt)"
        echo "Smoke test gecti; trafik $$REV revision'ina aliniyor."
        gcloud run services update-traffic mobilrs-test \
          --region=europe-west1 \
          --project=project-f671a84c-0cde-40b8-921 \
          --to-revisions="$$REV=100" \
          --quiet

options:
  logging: CLOUD_LOGGING_ONLY

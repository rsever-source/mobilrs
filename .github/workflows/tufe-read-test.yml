name: TUFE read test

on:
  push:
    paths:
      - '.github/workflows/tufe-read-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test TÜİK DataBrowser2 CPI endpoint
        shell: python
        run: |
          import json
          import urllib.request

          flow = 'TR,DF_TUFE_SDMX_TT04,1.0'
          base = f'https://databrowser2.tuik.gov.tr/api/core/nodes/1/datasets/{flow}'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36',
              'Accept': 'application/json',
              'Content-Type': 'application/json',
          }

          req = urllib.request.Request(base + '/structure', headers=headers)
          with urllib.request.urlopen(req, timeout=45) as r:
              raw = r.read().decode('utf-8')
              print('STRUCTURE_HTTP=', r.status)
              print('STRUCTURE_BYTES=', len(raw))
              structure = json.loads(raw)

          criteria = structure.get('template', {}).get('criteria')
          if not criteria:
              raise SystemExit('No template.criteria in structure response')

          print('CRITERIA_COUNT=', len(criteria))

          body = json.dumps(criteria).encode('utf-8')
          req = urllib.request.Request(base + '/data', data=body, headers=headers, method='POST')
          with urllib.request.urlopen(req, timeout=90) as r:
              raw = r.read().decode('utf-8')
              print('DATA_HTTP=', r.status)
              print('DATA_BYTES=', len(raw))
              payload = json.loads(raw)

          print('CLASS=', payload.get('class'))
          print('IDS=', payload.get('id'))
          print('SIZE=', payload.get('size'))
          print('TIME_ROLE=', payload.get('role', {}).get('time'))

          dims = payload.get('dimension', {})
          time_ids = payload.get('role', {}).get('time') or []
          if time_ids:
              tid = time_ids[0]
              tdim = dims.get(tid, {})
              print('TIME_LABEL=', tdim.get('label'))
              print('TIME_CODES_TAIL=', list((tdim.get('category', {}).get('label') or {}).items())[-8:])

          values = payload.get('value')
          print('VALUE_TYPE=', type(values).__name__)
          print('VALUE_COUNT=', len(values) if hasattr(values, '__len__') else 'NA')

          if payload.get('class') != 'dataset' or not values:
              raise SystemExit('JSON-stat dataset/values not returned')

          print('RESULT=SUCCESS DataBrowser2 returned CPI dataset')

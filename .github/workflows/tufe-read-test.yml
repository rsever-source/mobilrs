name: TUFE read test

on:
  push:
    paths:
      - '.github/workflows/tufe-read-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Extract latest official 12-month average TÜFE
        shell: python
        run: |
          import json
          import urllib.request

          flow = 'TR,DF_TUFE_SDMX_TT10,1.0'
          base = f'https://databrowser2.tuik.gov.tr/api/core/nodes/1/datasets/{flow}'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36',
              'Accept': 'application/json',
              'Content-Type': 'application/json',
          }

          req = urllib.request.Request(base + '/structure', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              structure = json.loads(r.read().decode('utf-8'))

          criteria = structure['template']['criteria']
          req = urllib.request.Request(base + '/data', data=json.dumps(criteria).encode(), headers=headers, method='POST')
          with urllib.request.urlopen(req, timeout=60) as r:
              p = json.loads(r.read().decode('utf-8'))

          ids = p['id']
          sizes = p['size']
          dims = p['dimension']
          values = p['value']

          # JSON-stat category positions.
          pos_to_code = {}
          for dim_id in ids:
              cat = dims[dim_id]['category']
              idx = cat.get('index', [])
              if isinstance(idx, dict):
                  pos_to_code[dim_id] = {v: k for k, v in idx.items()}
              else:
                  pos_to_code[dim_id] = {i: code for i, code in enumerate(idx)}

          def unravel(flat):
              coords = [0] * len(sizes)
              rem = int(flat)
              for i in range(len(sizes)-1, -1, -1):
                  coords[i] = rem % sizes[i]
                  rem //= sizes[i]
              return coords

          matches = []
          for flat, val in values.items():
              coords = unravel(flat)
              row = {dim_id: pos_to_code[dim_id][pos] for dim_id, pos in zip(ids, coords)}
              if row.get('DEGISIM') == '5':
                  matches.append((row['TIME_PERIOD'], float(val), row))

          if not matches:
              raise SystemExit('12-month moving-average series not found')

          matches.sort(key=lambda x: x[0])
          period, rate, row = matches[-1]
          print('LATEST_PERIOD=', period)
          print('LATEST_RATE=', f'{rate:.2f}')
          print('DEGISIM_LABEL=', dims['DEGISIM']['category']['label']['5'])
          print('ROW=', json.dumps(row, ensure_ascii=False))

          if period != '2026-08':
              raise SystemExit(f'Unexpected latest period: {period}')
          if round(rate, 2) != 31.79:
              raise SystemExit(f'Unexpected latest rate: {rate}')

          print('RESULT=SUCCESS August 2026 / 31.79 verified from official TÜİK DataBrowser2')

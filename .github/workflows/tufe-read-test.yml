name: TUFE read test

on:
  push:
    paths:
      - '.github/workflows/tufe-read-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch TUİK and print latest CPI info
        shell: python
        run: |
          import re
          import urllib.request
          from html import unescape

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36',
              'Accept-Language': 'tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7',
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status, r.geturl(), r.read().decode('utf-8', 'ignore')

          tests = [
              'https://veriportali.tuik.gov.tr/',
              'https://veriportali.tuik.gov.tr/tr/press/58290',
          ]

          for url in tests:
              status, final_url, html = fetch(url)
              print('FETCH', status, final_url, 'bytes=', len(html))
              if status != 200:
                  raise SystemExit(f'HTTP {status}: {url}')

          status, final_url, html = fetch('https://veriportali.tuik.gov.tr/tr/press/58290')
          text = re.sub(r'<[^>]+>', ' ', html)
          text = unescape(re.sub(r'\s+', ' ', text))

          if 'Tüketici Fiyat Endeksi' not in text:
              raise SystemExit('CPI title not found in bulletin')

          period = re.search(r'Tüketici\s+Fiyat\s+Endeksi\s*[,–-]?\s*(Ocak|Şubat|Mart|Nisan|Mayıs|Haziran|Temmuz|Ağustos|Eylül|Ekim|Kasım|Aralık)\s+(20\d{2})', text, re.I)
          rate = re.search(r'on\s+iki\s+aylık\s+ortalamalara\s+göre.{0,160}?%\s*([0-9]{1,3}[,.][0-9]{1,2})', text, re.I)

          print('PERIOD=', period.group(1), period.group(2) if period else 'NOT_FOUND')
          print('RATE=', rate.group(1) if rate else 'NOT_FOUND')

          if not period or not rate:
              raise SystemExit('Period/rate parse failed')

          print('RESULT=', f'{period.group(1)} {period.group(2)} / %{rate.group(1)}')

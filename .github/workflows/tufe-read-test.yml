name: TUFE read test

on:
  push:
    paths:
      - '.github/workflows/tufe-read-test.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe TÜİK CPI tables
        shell: python
        run: |
          import json
          import urllib.request
          import urllib.error

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36',
              'Accept': 'application/json',
              'Content-Type': 'application/json',
          }

          for n in range(1, 13):
              flow = f'TR,DF_TUFE_SDMX_TT{n:02d},1.0'
              base = f'https://databrowser2.tuik.gov.tr/api/core/nodes/1/datasets/{flow}'
              try:
                  req = urllib.request.Request(base + '/structure', headers=headers)
                  with urllib.request.urlopen(req, timeout=25) as r:
                      structure = json.loads(r.read().decode('utf-8'))
                  criteria = structure.get('template', {}).get('criteria')
                  if not criteria:
                      print('FLOW', flow, 'NO_CRITERIA')
                      continue
                  req = urllib.request.Request(base + '/data', data=json.dumps(criteria).encode(), headers=headers, method='POST')
                  with urllib.request.urlopen(req, timeout=60) as r:
                      p = json.loads(r.read().decode('utf-8'))
                  dims = p.get('dimension', {})
                  ids = p.get('id', [])
                  freq = list((dims.get('FREQ', {}).get('category', {}).get('label') or {}).items())
                  deg = list((dims.get('DEGISIM', {}).get('category', {}).get('label') or {}).items())
                  times = list((dims.get('TIME_PERIOD', {}).get('category', {}).get('label') or {}).items())
                  print('\nFLOW=', flow)
                  print('IDS=', ids)
                  print('FREQ=', freq)
                  print('DEGISIM=', deg)
                  print('TIME_TAIL=', times[-15:])
                  print('SIZE=', p.get('size'))
              except urllib.error.HTTPError as e:
                  print('FLOW', flow, 'HTTP', e.code)
              except Exception as e:
                  print('FLOW', flow, 'ERR', repr(e))

          print('RESULT=PROBE_DONE')

name: Private admin validation

on:
  push:
    branches:
      - feature/private-news-admin
    paths:
      - "admin_dashboard.py"
      - "excel_vlookup_api.py"
      - "news_service.py"
      - "system_report.py"
      - "tests/test_news_source_diagnostics.py"
      - "requirements.txt"
      - "ADMIN_DASHBOARD_SETUP.md"
      - ".github/workflows/admin-dashboard-validation.yml"
  pull_request:
    branches:
      - cloud-run-migration
    paths:
      - "admin_dashboard.py"
      - "excel_vlookup_api.py"
      - "news_service.py"
      - "system_report.py"
      - "tests/test_news_source_diagnostics.py"
      - "requirements.txt"
      - "ADMIN_DASHBOARD_SETUP.md"
      - ".github/workflows/admin-dashboard-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile admin_dashboard.py excel_vlookup_api.py news_service.py system_report.py tests/test_news_source_diagnostics.py
      - name: Test news source parsing diagnostics
        run: python -m unittest discover -s tests -p 'test_news_source_diagnostics.py' -v
      - name: Check embedded browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path("admin_dashboard.py").read_text(encoding="utf-8")
          for name in ("LOGIN_HTML", "DASHBOARD_HTML"):
              match = re.search(name + r" = r'''(.*?)'''", source, re.S)
              if not match:
                  raise SystemExit("Could not find " + name)
              html = match.group(1).replace("{nonce}", "test-nonce").replace("{{", "{").replace("}}", "}")
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S)
              if not scripts:
                  raise SystemExit("No script found in " + name)
              Path("/tmp/" + name + ".js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/LOGIN_HTML.js
          node --check /tmp/DASHBOARD_HTML.js
      - name: Verify admin router imports and routes
        run: |
          python - <<'PY'
          import admin_dashboard
          paths = {route.path for route in admin_dashboard.router.routes}
          required = {
              "/admin/haber-durumu",
              "/admin/api/login/password",
              "/admin/api/status",
              "/admin/api/logout",
          }
          missing = required - paths
          if missing:
              raise SystemExit("Missing routes: " + ", ".join(sorted(missing)))
          import excel_vlookup_api
          if not hasattr(excel_vlookup_api.app, "router"):
              raise SystemExit("FastAPI application failed to initialize")
          print("Admin router imports and FastAPI application initializes successfully.")
          PY

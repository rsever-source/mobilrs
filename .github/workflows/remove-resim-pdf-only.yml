name: Remove only Resim PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only Resim PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('excel_vlookup_api.py')
          s=p.read_text()
          if '/resim-pdf-islem' not in s:
              raise SystemExit('Resim PDF backend route not found')
          s=s.replace('from typing import List\n','')
          s=s.replace('from PIL import Image, ImageOps\n','')
          s=s.replace('MAX_IMAGES_TOTAL_SIZE = 100 * 1024 * 1024\n','')
          s=re.sub(r'\n@app\.post\("/resim-pdf-islem"\)[\s\S]*?(?=\n@app\.post\("/pdf-excel-islem"\))','',s,count=1)
          marker_start='HOME_HTML = r\'\'\''
          a=s.index(marker_start)+len(marker_start)
          b=s.index("'''",a)
          home=s[a:b]
          def remove_element_at(home, pos):
              starts=[]
              for m in re.finditer(r'<(section|div)\b[^>]*>',home,re.I|re.S):
                  if m.start()<=pos: starts.append(m)
                  else: break
              if not starts: return None
              st=starts[-1]
              tag=st.group(1).lower()
              depth=0
              pat=re.compile(r'<(/?)(section|div)\b[^>]*>',re.I|re.S)
              for m in pat.finditer(home,st.start()):
                  if m.group(2).lower()!=tag: continue
                  if not m.group(1): depth+=1
                  else:
                      depth-=1
                      if depth==0: return st.start(),m.end()
              return None
          removed=0
          while True:
              hits=[m.start() for m in re.finditer(r'imgpdf|Resim\s*(?:→|->)\s*PDF',home,re.I)]
              if not hits: break
              span=remove_element_at(home,hits[0])
              if not span: raise SystemExit('Could not locate Resim PDF UI element')
              home=home[:span[0]]+home[span[1]:]
              removed+=1
          if removed==0: raise SystemExit('Resim PDF UI not found')
          s=s[:a]+home+s[b:]
          p.write_text(s)
          print('Removed UI elements:',removed)
          PY
      - name: Verify only requested feature removed
        run: |
          grep -q '/kira-hesapla' excel_vlookup_api.py
          grep -q '/api/otv' excel_vlookup_api.py
          grep -q '/pdf-excel-islem' excel_vlookup_api.py
          ! grep -q '/resim-pdf-islem' excel_vlookup_api.py
          ! grep -qi 'imgpdf' excel_vlookup_api.py
      - name: Commit and delete this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add excel_vlookup_api.py
          git rm .github/workflows/remove-resim-pdf-only.yml
          git commit -m "Remove Resim PDF without changing other RDV tools"
          git push
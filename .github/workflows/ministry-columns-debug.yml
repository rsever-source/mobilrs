name: Ministry Columns Probe

on:
  push:
    paths:
      - '.github/workflows/ministry-columns-debug.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ministry PDF columns
        run: |
          pip -q install pdfplumber requests
          python - <<'PY'
          import io, requests, pdfplumber
          url='https://www.sanayi.gov.tr/assets/pdf/birimler/2026YiliMotorluAraclarYerliKatkiOraniBeyanlari.pdf'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=60); r.raise_for_status()
          with pdfplumber.open(io.BytesIO(r.content)) as pdf:
              shown=0
              for page in pdf.pages:
                  for table in page.extract_tables() or []:
                      for row in table or []:
                          if not row: continue
                          vals=[' '.join(str(x or '').split()) for x in row]
                          text=' | '.join(vals)
                          if shown < 8 or any(x in text.upper() for x in ['TOGG','BOREAL','COROLLA','I20','EGEA']):
                              print('COLS',len(vals),vals)
                              shown += 1
                          if shown > 35: raise SystemExit
          PY

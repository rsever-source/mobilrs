name: Fix PDF selection indicator only
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only PDF selection display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('excel_vlookup_api.py')
          s=p.read_text()
          old='<div class="filebox">＋ PDF Dosyasını Seç<input type="file" name="pdf_file" accept=".pdf" required></div><button class="btn green">PDF\'i Excel\'e Çevir</button>'
          new='<div class="filebox" id="pdfFileBox">📄 <span id="pdfFileName">PDF seçilmedi — PDF Dosyasını Seç</span><input type="file" name="pdf_file" accept=".pdf" required onchange="pdfSecildi(this)"></div><button class="btn green">PDF\'i Excel\'e Çevir</button>'
          if old not in s:
              raise SystemExit('Expected PDF selection block not found')
          s=s.replace(old,new,1)
          old_js='function renderOTV(){document.getElementById(\'otvLimit\').textContent=tl(otvData.limit);buttons();'
          new_js='function pdfSecildi(input){let el=document.getElementById(\'pdfFileName\');if(input.files&&input.files.length){el.textContent=\'✓ PDF seçildi: \'+input.files[0].name;}else{el.textContent=\'PDF seçilmedi — PDF Dosyasını Seç\';}}function renderOTV(){document.getElementById(\'otvLimit\').textContent=tl(otvData.limit);buttons();'
          if old_js not in s:
              raise SystemExit('Expected JS insertion point not found')
          s=s.replace(old_js,new_js,1)
          p.write_text(s)
          PY
      - name: Verify only requested UI change
        run: |
          grep -q 'pdfSecildi' excel_vlookup_api.py
          grep -q 'pdfFileName' excel_vlookup_api.py
          grep -q '/pdf-excel-islem' excel_vlookup_api.py
          grep -q '/kira-hesapla' excel_vlookup_api.py
          grep -q '/api/otv' excel_vlookup_api.py
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add excel_vlookup_api.py
          git rm .github/workflows/fix-pdf-selection-only.yml
          git commit -m "Make PDF selection visible"
          git push

name: RDV Render Keep Alive

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RDV Asistan
        run: curl -fsS --max-time 60 https://rdvsever.onrender.com/ > /dev/null

      - name: Refresh OTV cache when needed
        run: curl -fsS --max-time 300 https://rdvsever.onrender.com/api/otv > /dev/null

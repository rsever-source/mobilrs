name: Toyota Price Source Probe

on:
  push:
    paths:
      - '.github/workflows/toyota-debug.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect embedded Toyota grade data
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136.0 Safari/537.36'
          curl -sS -o /tmp/corolla.html -X POST -A "$UA" \
            -H 'Accept: text/html,application/xhtml+xml,*/*' \
            -H 'Referer: https://www.toyota.com.tr/araba-modelleri/corolla-sedan' \
            'https://dxp-webcarconfig.toyota-europe.com/v1/grade-selector/tr/tr?modelId=65bfd91d-f2a8-4cbb-bdbc-3834b400492a'
          curl -sS -o /tmp/chr.html -X POST -A "$UA" \
            -H 'Accept: text/html,application/xhtml+xml,*/*' \
            -H 'Referer: https://www.toyota.com.tr/araba-modelleri/c-hr' \
            'https://dxp-webcarconfig.toyota-europe.com/v1/grade-selector/tr/tr?modelId=6c193d6b-514c-436f-ab43-654d97e601d8'

          python - <<'PY'
          import json, html, re
          from pathlib import Path

          def walk(obj, path=()):
              if isinstance(obj, dict):
                  yield path, obj
                  for k,v in obj.items(): yield from walk(v, path+(str(k),))
              elif isinstance(obj, list):
                  for i,v in enumerate(obj): yield from walk(v, path+(str(i),))

          def inspect(path, names):
              s=Path(path).read_text(encoding='utf-8')
              m=re.search(r'<div[^>]+-data"[^>]*>(.*?)</div>', s, re.S)
              if not m:
                  print('NO DATA DIV', path); return
              data=json.loads(html.unescape(m.group(1)))
              print('\n===', path, 'TOP KEYS', list(data)[:20], '===')
              seen=0
              for p,d in walk(data):
                  blob=json.dumps(d, ensure_ascii=False)
                  if any(n.lower() in blob.lower() for n in names):
                      price_keys={k:v for k,v in d.items() if any(x in k.lower() for x in ['price','cash','amount','list','grade','name','title'])}
                      if price_keys:
                          print('PATH', '/'.join(p[-7:]))
                          print(json.dumps(price_keys, ensure_ascii=False)[:3500])
                          seen+=1
                          if seen>=35: break
              print('MATCH DICTS', seen)

          inspect('/tmp/corolla.html', ['Vision Plus','Dream','Flame','Passion'])
          inspect('/tmp/chr.html', ['Flame','Passion','GR SPORT','X-Sport'])
          PY

name: TBB TLS certificate diagnostics

on:
  push:
    branches:
      - cloud-run-migration
    paths:
      - ".github/workflows/tbb-tls-diagnostic.yml"
      - "Dockerfile"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Cloud Run source
        uses: actions/checkout@v4
        with:
          ref: cloud-run-migration

      - name: Build the same application image used by Cloud Run
        run: docker build --pull -t mobilrs-tbb-tls-probe .

      - name: Inspect certificate and test safe alternate sources
        shell: bash
        run: |
          set -euo pipefail
          for host in www.tbb.gov.tr tbb.gov.tr; do
            echo "===== TLS CHAIN: $host ====="
            timeout 20 openssl s_client -connect "${host}:443" -servername "$host" -showcerts -verify_return_error </dev/null 2>&1 | grep -E '^(depth=|verify error:|Verification:|Verify return code:| *[0-9]+ s:| *i:)' || true
          done
          docker run --rm -i mobilrs-tbb-tls-probe python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from urllib.parse import urljoin, urlparse
          from zoneinfo import ZoneInfo

          import certifi
          import requests
          from bs4 import BeautifulSoup

          print("certifi", certifi.__version__)
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "tr-TR,tr;q=0.9,en-US;q=0.8,en;q=0.7",
          })
          print("===== RESMI GAZETE ALTERNATE ROUTES =====")
          for url in (
              "https://www.resmigazete.gov.tr/gbook.html",
              "https://www.resmigazete.gov.tr/10.11.2026",
              "https://resmigazete.gov.tr/fihrist?tarih=2026-11-10",
              "https://resmigazete.gov.tr/10.11.2026",
              "https://www.resmigazete.gov.tr/eskiler/2026/11/20261110-2.htm",
          ):
              try:
                  response = session.get(url, timeout=(8, 25), allow_redirects=True)
                  soup = BeautifulSoup(response.text, "html.parser")
                  print("RG_ROUTE", url, "status=", response.status_code,
                        "final=", response.url, "bytes=", len(response.content),
                        "title=", soup.title.get_text(" ", strip=True) if soup.title else "")
              except requests.exceptions.RequestException as exc:
                  print("RG_ROUTE_FAIL", url, type(exc).__name__, str(exc)[:400])
          for host in ("www.tbb.gov.tr", "tbb.gov.tr"):
              url = f"https://{host}/tr/mevzuat-duyurulari"
              for mode, verify in (("certifi", True), ("system-ca", "/etc/ssl/certs/ca-certificates.crt")):
                  try:
                      response = requests.get(url, timeout=(6, 12), allow_redirects=False, verify=verify)
                      print("TLS_RESULT", host, mode, response.status_code, response.headers.get("Location"))
                  except requests.exceptions.RequestException as exc:
                      print("TLS_ERROR", host, mode, type(exc).__name__, str(exc)[:500])

          print("===== TBB HOST-HEADER ALTERNATIVE =====")
          try:
              response = requests.get(
                  "https://tbb.gov.tr/tr/mevzuat-duyurulari",
                  headers={"Host": "www.tbb.gov.tr"},
                  timeout=(6, 12),
                  allow_redirects=False,
              )
              print("TBB_HOST_OVERRIDE", response.status_code, response.headers.get("Location"),
                    len(response.content), response.text[:160].replace("\\n", " "))
          except requests.exceptions.RequestException as exc:
              print("TBB_HOST_OVERRIDE_ERROR", type(exc).__name__, str(exc)[:500])

          print("===== OFFICIAL GAZETTE 7-DAY SCAN =====")
          sources = json.load(open("news_sources.json", encoding="utf-8"))
          tbb_source = next(s for s in sources if s.get("kind") == "tbb_mevzuat")
          keywords = [str(k).casefold() for k in tbb_source.get("keywords", [])]
          today = datetime.now(ZoneInfo("Europe/Istanbul")).date()
          found = []
          errors = []
          for offset in range(7):
              day = today - timedelta(days=offset)
              url = "https://www.resmigazete.gov.tr/" + day.strftime("%d.%m.%Y")
              try:
                  response = requests.get(url, timeout=(6, 12))
                  if response.status_code == 404:
                      print("RG_NO_ISSUE", day.isoformat())
                      continue
                  response.raise_for_status()
                  soup = BeautifulSoup(response.text, "html.parser")
                  anchors = soup.find_all("a", href=True)
                  page_matches = 0
                  for a in anchors:
                      title = " ".join(a.get_text(" ", strip=True).split())
                      if len(title) < 10 or not any(k in title.casefold() for k in keywords):
                          continue
                      href = urljoin(url, a["href"])
                      if urlparse(href).netloc != "www.resmigazete.gov.tr":
                          continue
                      if not href.endswith((".htm", ".html", ".pdf")):
                          continue
                      found.append((day.isoformat(), title[:220], href))
                      page_matches += 1
                  print("RG_DAY", day.isoformat(), response.status_code,
                        "anchors", len(anchors), "keyword_matches", page_matches)
              except requests.exceptions.RequestException as exc:
                  errors.append((day.isoformat(), type(exc).__name__, str(exc)[:300]))
                  print("RG_DAY_ERROR", day.isoformat(), type(exc).__name__, str(exc)[:300])

          print("RG_TOTAL_MATCHES", len(found), "RG_ERRORS", errors)
          for row in found[:50]:
              print("RG_MATCH", row)

          print("===== SAMPLE OFFICIAL DOCUMENT FETCH =====")
          for day, title, href in found[:8]:
              try:
                  response = requests.get(href, timeout=(6, 12))
                  print("RG_DETAIL", response.status_code, response.headers.get("Content-Type"),
                        len(response.content), href)
                  if response.status_code == 200 and "html" in response.headers.get("Content-Type", "").lower():
                      soup = BeautifulSoup(response.text, "html.parser")
                      print("RG_DETAIL_TEXT", " ".join(soup.get_text(" ", strip=True).split())[:600])
              except requests.exceptions.RequestException as exc:
                  print("RG_DETAIL_ERROR", href, type(exc).__name__, str(exc)[:300])

          print("===== ACTUAL ENGELLI.ME RESMI GAZETE FALLBACK PARSER =====")
          import news_service as ns
          fallback_source = next(s for s in sources if s.get("kind") == "resmigazete")
          fallback_items = ns._resmigazete_items(fallback_source)
          print("FALLBACK_ITEMS", len(fallback_items))
          for item in fallback_items[:20]:
              print("FALLBACK_ITEM", item.get("published_at"),
                    item.get("title"), item.get("url"),
                    "content_chars=", len(item.get("content", "")))
          print("FALLBACK_DIAGNOSTIC",
                json.dumps(ns._SOURCE_DIAGNOSTICS.get(fallback_source["name"], {}),
                           ensure_ascii=False))

          print("===== REAL TBB-LINKED OFFICIAL DOCUMENT EXTRACTION =====")
          official_document = (
              "https://www.resmigazete.gov.tr/eskiler/2026/10/20261007-4.htm"
          )
          official_text = ns._resmigazete_document_text(official_document)
          print("OFFICIAL_DOCUMENT_OK", official_document,
                "characters=", len(official_text))
          print("OFFICIAL_DOCUMENT_SAMPLE", official_text[:1000])
          PY

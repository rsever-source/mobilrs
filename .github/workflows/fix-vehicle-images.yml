name: Fix vehicle images

on:
  push:
    branches: [cloud-run-migration]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vehicle-images-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vehicle image map and card layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('excel_vlookup_api.py')
          s = p.read_text(encoding='utf-8')

          old = """function vehicleImage(v){let b=(v.brand||'').toUpperCase(),m=(v.model||'').toUpperCase();if(b==='RENAULT'&&m.includes('BOREAL'))return 'https://upload.wikimedia.org/wikipedia/commons/4/42/2026_Renault_Boreal_front_view_01.png';if(b==='TOYOTA'&&m.includes('C-HR'))return 'https://toyota-media.ch/__image/a/2248486/alias/xxl/v/4/c/25/ar/16-9/fn/Toyota%20C-HR%202026_01.jpg';if(b==='TOYOTA'&&m.includes('COROLLA'))return 'https://modenamotorsgmbh.com/98819-thickbox_default/toyota-corolla-sedan-18-hybrid-elite-edition-my2026.jpg';if(b==='HYUNDAI'&&m.includes('BAYON'))return 'https://storage.googleapis.com/fp-media/1/2025/12/Hyundai-Bayon-MY26.jpg';if(b==='HYUNDAI'&&m.includes('TUCSON'))return 'https://imgd-ct.aeplcdn.com/664x415/n/cw/ec/166925/tucson-facelift-left-front-three-quarter.jpeg?isig=0&q=80';if(b==='TOGG')return 'https://www.togg.eu/assets/img/68a4514343d1be59b0dab71b_T10X-Range.webp';if(b==='FIAT'&&m.includes('EGEA'))return 'https://cdn.otopodyum.com.tr/other/2023/12/08/egea-sedan.webp';if(b==='FIAT'&&m.includes('ULYSSE'))return 'https://www.espaciofurgo.com/wp-content/uploads/2024/01/fiat-ulysse.jpg';return ''}"""

          new = """function vehicleImage(v){let b=(v.brand||'').toUpperCase(),m=(v.model||'').toUpperCase();if(b==='RENAULT'&&m.includes('BOREAL'))return 'https://www.automovelnacional.com.br/admin/imagens/editor/2002102722.jpg';if(b==='RENAULT'&&m.includes('DUSTER'))return 'https://imgd.aeplcdn.com/1920x1080/n/cw/ec/163801/duster-exterior-right-front-three-quarter-5.jpeg?isig=0&q=90';if(b==='RENAULT'&&m.includes('CLIO'))return 'https://cms.bilhandel.dk/media/gihc2rsz/g0vc5o6wmaaitkp.jpeg';if(b==='RENAULT'&&m.includes('MEGANE'))return 'https://imagecdnsa.zigwheels.ae/large/gallery/exterior/33/371/renault-megane-24585.jpg';if(b==='TOYOTA'&&m.includes('C-HR'))return 'https://toyota-media.ch/__image/a/2248486/alias/xxl/v/4/c/25/ar/16-9/fn/Toyota%20C-HR%202026_01.jpg';if(b==='TOYOTA'&&m.includes('COROLLA'))return 'https://modenamotorsgmbh.com/98819-thickbox_default/toyota-corolla-sedan-18-hybrid-elite-edition-my2026.jpg';if(b==='HYUNDAI'&&m.includes('BAYON'))return 'https://pro.bbcdn.io/9e/9ee7684a-7e64-4d8c-9adb-ae55cf82ca10?format=.jpg&rule=legacy-largest';if(b==='TOGG')return 'https://www.togg.eu/assets/img/68a4514343d1be59b0dab71b_T10X-Range.webp';if(b==='FIAT'&&m.includes('EGEA'))return 'https://arbstorage.mncdn.com/modelphotos/60cf26a2-ff58-461c-a8a5-fbc3cbce58b1_912x513.jpg';if(b==='FIAT'&&m.includes('ULYSSE'))return 'https://manage.sifiraracal.com/public/resim/galeri/1002/43084/fiat-ulysse.png';return ''}"""

          if old not in s:
              raise SystemExit('vehicleImage eski blok bulunamadı; güvenli şekilde durduruldu')
          s = s.replace(old, new)

          s = s.replace('.homevehicles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow:hidden}', '.homevehicles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;overflow:visible}')
          s = s.replace('.homecar .carpic{height:118px;', '.homecar .carpic{height:150px;')
          s = s.replace('.homecar .carpic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:5px}', '.homecar .carpic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:0}')
          s = s.replace('.homecar .carbrand{font-size:11px;', '.homecar .carbrand{font-size:12px;')
          s = s.replace('.homecar .carmodel{font-size:14px;', '.homecar .carmodel{font-size:15px;')

          marker = '</style></head>'
          extra = '<style>@media (max-width:767px){.homevehicles{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;padding-bottom:5px}.homecar{flex:0 0 78%;scroll-snap-align:start}.homecar .carpic{height:155px}}@media (min-width:768px){.homecar .carpic{height:170px}}</style>'
          if extra not in s:
              s = s.replace(marker, extra + marker)

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excel_vlookup_api.py
          git diff --cached --quiet && exit 0
          git commit -m "fix vehicle images and home cards [vehicle-images-patched]"
          git push

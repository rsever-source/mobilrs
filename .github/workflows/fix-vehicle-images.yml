name: Fix vehicle images

on:
  push:
    branches: [cloud-run-migration]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vehicle-images-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vehicle image map and home cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('excel_vlookup_api.py')
          s = p.read_text(encoding='utf-8')

          image_fn = """function vehicleImage(v){let b=(v.brand||'').toUpperCase(),m=(v.model||'').toUpperCase();if(b==='RENAULT'&&m.includes('BOREAL'))return 'https://www.automovelnacional.com.br/admin/imagens/editor/2002102722.jpg';if(b==='RENAULT'&&m.includes('DUSTER'))return 'https://imgd.aeplcdn.com/1920x1080/n/cw/ec/163801/duster-exterior-right-front-three-quarter-5.jpeg?isig=0&q=90';if(b==='RENAULT'&&m.includes('CLIO'))return 'https://cms.bilhandel.dk/media/gihc2rsz/g0vc5o6wmaaitkp.jpeg';if(b==='RENAULT'&&m.includes('MEGANE'))return 'https://www.renault.com.tr/binek-araclar/megane-sedan.html';if(b==='TOYOTA'&&m.includes('C-HR'))return 'https://www.toyota.com.tr/araba-modelleri/c-hr';if(b==='TOYOTA'&&m.includes('COROLLA'))return 'https://www.toyota.com.tr/araba-modelleri/corolla-sedan';if(b==='HYUNDAI'&&m.includes('I20'))return 'https://www.hyundai.com/tr/tr/modeller/i20.html';if(b==='HYUNDAI'&&m.includes('BAYON'))return 'https://www.hyundai.com/tr/tr/modeller/bayon.html';if(b==='TOGG')return 'https://www.togg.eu/assets/img/68a4514343d1be59b0dab71b_T10X-Range.webp';if(b==='FIAT'&&m.includes('EGEA CROSS'))return 'https://www.fiat.com.tr/modeller/egea-cross';if(b==='FIAT'&&m.includes('EGEA'))return 'https://www.fiat.com.tr/modeller/egea';if(b==='FIAT'&&m.includes('ULYSSE'))return 'https://manage.sifiraracal.com/public/resim/galeri/1002/43084/fiat-ulysse.png';return ''}"""

          # Replace the complete JS vehicleImage function regardless of current image URLs.
          s, n = re.subn(r'function vehicleImage\(v\)\{.*?\}function verifiedRow', image_fn + 'function verifiedRow', s, count=1)
          if n != 1:
              raise SystemExit('vehicleImage fonksiyonu bulunamadı; güvenli şekilde durduruldu')

          # Home showcase = six cheapest distinct models, not first six database rows.
          old = r'function renderHomeVehicles\(\)\{.*?\}function renderHome\(\)'
          new = '''function renderHomeVehicles(){let el=document.getElementById("homeVehicles"),all=(otvData.vehicles||[]).filter(v=>Number(v.price)>0),byModel={};all.forEach(v=>{let key=((v.brand||"")+" "+(v.model||"")).trim().toUpperCase();if(!byModel[key]||Number(v.price)<Number(byModel[key].price))byModel[key]=v});let vs=Object.values(byModel).sort((a,b)=>Number(a.price)-Number(b.price)).slice(0,6);el.innerHTML=vs.length?vs.map(function(v){let img=vehicleImage(v);return "<div class=\\"homecar\\" onclick=\\"openPage('otv')\\" title=\\"Araç detaylarını gör\\"><div class=\\"carpic\\">"+(img?"<img src=\\""+img+"\\" loading=\\"lazy\\" alt=\\""+(v.brand||"")+" "+(v.model||"")+"\\" onerror=\\"this.parentElement.textContent='🚗';\\">":"🚗")+"</div><div class=\\"carbrand\\">"+(v.brand||"")+"</div><div class=\\"carmodel\\">"+(v.model||"")+"</div><div class=\\"carprice\\">"+tl(v.price)+"</div></div>"}).join(""):"<div class=\\"panel\\">Araç listesi yükleniyor…</div>"}function renderHome()'''
          s, n = re.subn(old, new, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('renderHomeVehicles fonksiyonu bulunamadı; güvenli şekilde durduruldu')

          # Keep Egea Sedan and Egea Cross as separate models and make showcase images larger.
          s = s.replace('.homevehicles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow:hidden}', '.homevehicles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;overflow:visible}')
          s = s.replace('.homecar .carpic{height:118px;', '.homecar .carpic{height:170px;')
          s = s.replace('.homecar .carpic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:5px}', '.homecar .carpic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:0}')

          marker='</style></head>'
          extra='<style>@media (max-width:767px){.homevehicles{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;padding-bottom:5px}.homecar{flex:0 0 82%;scroll-snap-align:start}.homecar .carpic{height:165px}}@media (min-width:768px){.homecar .carpic{height:190px}}</style>'
          if extra not in s: s=s.replace(marker,extra+marker)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excel_vlookup_api.py
          git diff --cached --quiet && exit 0
          git commit -m "fix cheapest six showcase and vehicle images [vehicle-images-patched]"
          git push

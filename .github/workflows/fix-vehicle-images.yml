name: Fix vehicle image pool and showcase

on:
  push:
    branches: [cloud-run-migration]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[vehicle-pool-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch vehicle image pool and showcase
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('excel_vlookup_api.py')
          s = p.read_text(encoding='utf-8')

          image_fn = r'''function vehicleImage(v){let b=(v.brand||'').toUpperCase().trim(),m=(v.model||'').toUpperCase().trim();let pool={
          'RENAULT|BOREAL':'https://www.automovelnacional.com.br/admin/imagens/editor/2002102722.jpg',
          'RENAULT|DUSTER':'https://imgd.aeplcdn.com/1920x1080/n/cw/ec/163801/duster-exterior-right-front-three-quarter-5.jpeg?isig=0&q=90',
          'RENAULT|CLIO':'https://cms.bilhandel.dk/media/gihc2rsz/g0vc5o6wmaaitkp.jpeg',
          'RENAULT|MEGANE':'https://imagecdnsa.zigwheels.ae/large/gallery/exterior/33/371/renault-megane-24585.jpg',
          'TOYOTA|C-HR':'https://toyota-media.ch/__image/a/2248486/alias/xxl/v/4/c/25/ar/16-9/fn/Toyota%20C-HR%202026_01.jpg',
          'TOYOTA|COROLLA':'https://modenamotorsgmbh.com/98819-thickbox_default/toyota-corolla-sedan-18-hybrid-elite-edition-my2026.jpg',
          'HYUNDAI|I20':'https://pro.bbcdn.io/9e/9ee7684a-7e64-4d8c-9adb-ae55cf82ca10?format=.jpg&rule=legacy-largest',
          'HYUNDAI|BAYON':'https://storage.googleapis.com/fp-media/1/2025/12/Hyundai-Bayon-MY26.jpg',
          'TOGG|T10X':'https://www.togg.eu/assets/img/68a4514343d1be59b0dab71b_T10X-Range.webp',
          'FIAT|EGEA CROSS':'https://www.fiat.com.tr/content/dam/fiat/nl/2024/egea-cross/fiat-egea-cross-exterior.png',
          'FIAT|EGEA':'https://arbstorage.mncdn.com/modelphotos/60cf26a2-ff58-461c-a8a5-fbc3cbce58b1_912x513.jpg',
          'FIAT|ULYSSE':'https://manage.sifiraracal.com/public/resim/galeri/1002/43084/fiat-ulysse.png'
          };let key=b+'|'+m;for(let k of Object.keys(pool)){if(key===k||((k.endsWith('|EGEA')||k.endsWith('|EGEA CROSS'))&&key===k)||(!m&&b===k.split('|')[0]))return pool[k]}for(let k of Object.keys(pool)){let parts=k.split('|');if(parts[0]===b&&m.includes(parts[1]))return pool[k]}return ''}function verifiedRow'''

          s, n = re.subn(r'function vehicleImage\(v\)\{.*?\}function verifiedRow', image_fn, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('vehicleImage fonksiyonu bulunamadı; güvenli şekilde durduruldu')

          showcase = r'''function renderHomeVehicles(){let el=document.getElementById("homeVehicles"),all=(otvData.vehicles||[]).filter(v=>Number(v.price)>0),byModel={};all.forEach(v=>{let key=((v.brand||"")+" "+(v.model||"")).trim().toUpperCase();if(!byModel[key]||Number(v.price)<Number(byModel[key].price))byModel[key]=v});let vs=Object.values(byModel).sort((a,b)=>Number(a.price)-Number(b.price)).slice(0,6);el.innerHTML=vs.length?vs.map(function(v){let img=vehicleImage(v);return "<div class=\"homecar\" onclick=\"openPage('otv')\" title=\"Araç detaylarını gör\"><div class=\"carpic\">"+(img?"<img src=\""+img+"\" loading=\"lazy\" alt=\""+(v.brand||"")+" "+(v.model||"")+"\" onerror=\"this.parentElement.textContent='🚗';\">":"🚗")+"</div><div class=\"carbrand\">"+(v.brand||"")+"</div><div class=\"carmodel\">"+(v.model||"")+"</div><div class=\"carprice\">"+tl(v.price)+"</div></div>"}).join(""):"<div class=\"panel\">Araç listesi yükleniyor…</div>"}function renderHome()'''
          s, n = re.subn(r'function renderHomeVehicles\(\)\{.*?\}function renderHome\(\)', showcase, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('renderHomeVehicles fonksiyonu bulunamadı; güvenli şekilde durduruldu')

          s = s.replace('.homevehicles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;overflow:hidden}', '.homevehicles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;overflow:visible}')
          s = s.replace('.homecar .carpic{height:118px;', '.homecar .carpic{height:170px;')
          s = s.replace('.homecar .carpic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:5px}', '.homecar .carpic img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;padding:0}')

          marker='</style></head>'
          extra='<style>@media (max-width:767px){.homevehicles{display:flex;overflow-x:auto;gap:12px;scroll-snap-type:x mandatory;padding-bottom:5px}.homecar{flex:0 0 82%;scroll-snap-align:start}.homecar .carpic{height:165px}}@media (min-width:768px){.homecar .carpic{height:190px}}</style>'
          if extra not in s: s=s.replace(marker,extra+marker)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add excel_vlookup_api.py
          git diff --cached --quiet && exit 0
          git commit -m "add model-based vehicle image pool [vehicle-pool-patched]"
          git push

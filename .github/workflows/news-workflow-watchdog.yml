name: Haber Workflow Zaman Aşımı Kontrolü

on:
  schedule:
    - cron: '17 */5 * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Engelli Haberleri Otomatik Güncelle
      - RDV OTV Daily Update
      - OTV Manuel Guncelle
      - RDV Asistan Health Monitor
      - TUFE read test
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  report-workflow-result:
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Rapor kodunu al
        uses: actions/checkout@v4
        with:
          repository: rsever-source/mobilrs
          ref: cloud-run-migration
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tamamlanan workflow sonucunu merkezi rapora yaz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: rsever-source/mobilrs
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
        run: |
          python - <<'PY'
          import os
          from system_report import record_check

          if os.environ.get("EVENT_NAME") == "workflow_dispatch":
              record_check(
                  "workflow-monitor-self-test", "success",
                  "Haber workflow izleyicisi elle tetiklendi; merkezi rapor yazımı çalıştı.",
                  immediate=True,
              )
              raise SystemExit(0)

          name = os.environ.get("WORKFLOW_NAME") or "Bilinmeyen workflow"
          conclusion = os.environ.get("WORKFLOW_CONCLUSION") or "unknown"
          url = os.environ.get("WORKFLOW_URL") or ""
          branch = os.environ.get("WORKFLOW_BRANCH") or "bilinmiyor"
          number = os.environ.get("WORKFLOW_RUN_NUMBER") or "?"
          run_id = os.environ.get("WORKFLOW_RUN_ID") or "?"
          workflow_id = os.environ.get("WORKFLOW_ID") or name
          component = "workflow:" + str(workflow_id)
          details = (
              f"Workflow: {name}; sonuç: {conclusion}; dal: {branch}; "
              f"çalışma no: {number}; run ID: {run_id}; çalışma: {url}"
          )

          if conclusion == "success":
              record_check(component, "success", details, immediate=True)
              if name == "Engelli Haberleri Otomatik Güncelle":
                  record_check(
                      "news-workflow-stale", "success",
                      "Engelli Haberleri Otomatik Güncelle başarıyla tamamlandı; akış durdu uyarısı kapatıldı. " + details,
                      immediate=True,
                  )
          elif conclusion in ("neutral", "skipped"):
              print("Atlanan/etkisiz workflow hata sayılmadı:", details)
          else:
              record_check(component, "failure", details, immediate=True)
          PY

  check-last-success:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Rapor kodunu al
        uses: actions/checkout@v4
        with:
          repository: rsever-source/mobilrs
          ref: cloud-run-migration
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Son başarılı zamanlanmış haber çalışmasını kontrol et
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: rsever-source/mobilrs
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from system_report import record_check

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"https://api.github.com/repos/{repo}/actions/runs?event=schedule&per_page=100"
          request = Request(url, headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "EngelliMe-News-Workflow-Watchdog",
          })

          with urlopen(request, timeout=20) as response:
              data = json.loads(response.read().decode("utf-8"))

          def completion_time(run):
              # GitHub bu depodaki tamamlanmış çalışmalar için completed_at alanını
              # null döndürüyor; bitiş zamanı için updated_at güvenilir yedektir.
              return run.get("completed_at") or run.get("updated_at") or run.get("run_started_at")

          runs = data.get("workflow_runs", [])
          successful = [
              run for run in runs
              if run.get("path") == ".github/workflows/news-cron.yml"
              and run.get("event") == "schedule"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
              and completion_time(run)
          ]
          latest = max(successful, key=completion_time, default=None)
          now = datetime.now(timezone.utc)

          if latest is None:
              age_hours = float("inf")
              details = "Son başarılı zamanlanmış haber workflow'u bulunamadı. Kontrol: " + url
          else:
              completed_at = completion_time(latest)
              completed = datetime.fromisoformat(completed_at.replace("Z", "+00:00"))
              age_hours = (now - completed).total_seconds() / 3600
              details = (
                  f"Son başarılı zamanlanmış haber çalışması: {latest.get('run_number')}; "
                  f"tamamlanma: {completed_at}; geçen süre: {age_hours:.2f} saat; "
                  f"çalışma: {latest.get('html_url', '')}"
              )

          if age_hours > 5:
              age_text = f"{age_hours:.2f} saat" if age_hours != float("inf") else "başarılı schedule kaydı yok"
              stale_details = (
                  f"5 saatten uzun süredir başarılı zamanlanmış haber çalışması yok ({age_text}). "
                  "Otomatik kurtarma tetiklemesi deneniyor. " + details
              )
              print("UYARI:", stale_details)

              # Mevcut haber workflow'unu yeniden tetikle; yeni workflow oluşturulmaz.
              dispatch_url = f"https://api.github.com/repos/{repo}/actions/workflows/news-cron.yml/dispatches"
              payload = json.dumps({"ref": "main"}).encode("utf-8")
              dispatch_request = Request(
                  dispatch_url,
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "EngelliMe-News-Workflow-Watchdog",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urlopen(dispatch_request, timeout=20) as response:
                      if response.status not in (200, 201, 204):
                          raise RuntimeError(f"GitHub API HTTP {response.status}")
                  record_check(
                      "news-workflow-stale", "failure",
                      stale_details + " Yeniden tetikleme GitHub tarafından kabul edildi; "
                      "haber workflow'unun sonucunu tamamlanma raporu üzerinden izle.",
                      immediate=True,
                  )
                  print("KURTARMA TETİKLENDİ: Engelli Haberleri Otomatik Güncelle yeniden başlatıldı.")
              except Exception as exc:
                  failure_details = stale_details + " Yeniden tetikleme başarısız: " + repr(exc)
                  record_check("news-workflow-stale", "failure", failure_details, immediate=True)
                  print("HATA:", failure_details)
          else:
              record_check("news-workflow-stale", "success", details, immediate=True)
              print("TAMAM:", details)
          PY

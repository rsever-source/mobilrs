name: EK-2 tests

on:
  push:
    branches:
      - deploy/ek2-live-homepage
      - cloud-run-migration
  pull_request:
    branches:
      - cloud-run-migration

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check site API
        run: python -m py_compile excel_vlookup_api.py
      - name: Test Araç-1
        run: python -m unittest discover -s ek2-balthazard/arac1 -p "test_*.py" -v
      - name: Test Araç-2
        run: python -m unittest discover -s ek2-balthazard/arac2 -p "test_*.py" -v
      - name: Test catalog and calculator
        run: python -m unittest discover -s ek2-balthazard -p "test_*.py" -v
      - name: Check Araç 3 inline JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.current = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      self.scripts.append("".join(self.current))
                      self.in_script = False
                      self.current = []

          html = Path("ek2-balthazard/arac3/arac3.html").read_text(encoding="utf-8")
          parser = InlineScriptParser()
          parser.feed(html)
          if not parser.scripts or not any(script.strip() for script in parser.scripts):
              raise SystemExit("Araç 3 inline JavaScript bulunamadı.")
          Path("/tmp/arac3-inline.js").write_text("\n".join(parser.scripts), encoding="utf-8")
          PY
          node --check /tmp/arac3-inline.js

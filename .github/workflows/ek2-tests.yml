name: EK-2 tests

on:
  push:
    branches:
      - deploy/ek2-live-homepage
      - cloud-run-migration
  pull_request:
    branches:
      - cloud-run-migration

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Araç-1
        run: python -m unittest discover -s ek2-balthazard/arac1 -p "test_*.py" -v
      - name: Test Araç-2
        run: python -m unittest discover -s ek2-balthazard/arac2 -p "test_*.py" -v
      - name: Test catalog and calculator
        run: python -m unittest discover -s ek2-balthazard -p "test_*.py" -v

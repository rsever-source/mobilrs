name: Engelli Haberleri Güncelle

on:
  workflow_dispatch:
  schedule:
    # Türkiye saatiyle yaklaşık 00:20, 03:20, 06:20, 09:20, 12:20, 15:20, 18:20, 21:20.
    - cron: "20 0,3,6,9,12,15,18,21 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4
      - name: Haberleri Gemini ile güncelle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: python update_news.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "engelli.me news bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "Yeni haber yok."
          else
            git commit -m "Güncel engelli haberlerini yenile"
            git push
          fi

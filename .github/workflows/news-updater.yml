name: Engelli Haberleri Güncelle

on:
  workflow_dispatch:
  schedule:
    # Türkiye saatiyle 13:20, 16:15 ve 22:15 (UTC+3).
    - cron: "20 10,13,19 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Haber branch'ini al
        uses: actions/checkout@v4
        with:
          ref: cloud-run-migration
          fetch-depth: 0
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4
      - name: Haberleri Gemini ile güncelle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: python update_news.py
      - name: Değişiklik varsa cloud-run-migration'a kaydet
        run: |
          git config user.name "engelli.me news bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "Yeni haber yok."
          else
            git commit -m "Güncel engelli haberlerini yenile"
            git push origin HEAD:cloud-run-migration
          fi

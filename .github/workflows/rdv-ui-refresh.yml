name: One-time RDV UI refresh
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused home UI refresh
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('excel_vlookup_api.py')
          s=p.read_text()
          old_css='.top{font-size:28px;font-weight:850;margin:10px 2px 18px}.hero{background:linear-gradient(145deg,var(--blue2),#0745cb);color:#fff;border-radius:22px;padding:18px;box-shadow:0 14px 35px #0b57e32b}.hero h2{margin:0 0 5px;font-size:21px}.sub{font-size:13px;opacity:.9}.herofoot{display:flex;justify-content:space-between;align-items:end;margin:18px 0 14px}.herofoot small{display:block;opacity:.82}.herofoot b{display:block;font-size:22px;margin-top:3px}.hero button{width:100%;border:0;border-radius:12px;padding:12px;background:#fff;color:var(--blue);font-weight:800}'
          new_css='.top{display:flex;align-items:center;gap:11px;margin:10px 2px 18px}.brandmark{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,#183a72,#0f2b58);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;letter-spacing:-1px;box-shadow:0 6px 18px #0b57e31f}.brandname{font-size:25px;font-weight:850}.hero{background:linear-gradient(145deg,#fff,#f3f6fd);color:var(--ink);border:1px solid #e1e7f1;border-radius:22px;padding:16px;box-shadow:0 10px 28px #0b57e312}.herotop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.hero h2{margin:7px 0 5px;font-size:21px}.carbadge{width:38px;height:38px;border-radius:11px;background:#eef4ff;display:grid;place-items:center;font-size:20px}.sub{font-size:12px;color:var(--muted);line-height:1.35}.check{text-align:right;min-width:112px;padding-top:3px}.check small{display:block;color:var(--muted);font-size:10px}.check b{display:block;color:var(--blue);font-size:16px;margin-top:4px}.herofoot{display:flex;gap:34px;align-items:end;margin:14px 0 12px}.herofoot small{display:block;color:var(--muted);font-size:10px}.herofoot b{display:block;font-size:22px;color:var(--blue);margin-top:3px}.hero button{width:100%;border:0;border-radius:12px;padding:12px;background:var(--blue);color:#fff;font-weight:800}'
          if old_css not in s:
              raise SystemExit('CSS target not found')
          s=s.replace(old_css,new_css,1)
          old_html='<section id="home" class="page on"><div class="top">RDV Asistan</div><div class="hero"><h2>🚗 ÖTV Muaf Araçlar</h2><div class="sub">Bakanlık yerlilik listesi + resmî fiyat kaynakları</div><div class="herofoot"><div><small>Uygun paket</small><b id="heroCount">—</b></div><div><small>Son fiyat kontrolü</small><b id="heroTime">—</b></div></div><button onclick="openPage(\'otv\')">Tümünü Gör ›</button></div><div class="sec"><h3>Projeler</h3></div>'
          new_html='<section id="home" class="page on"><div class="top"><div class="brandmark">RS</div><div class="brandname">RDV Asistan</div></div><div class="hero"><div class="herotop"><div><div class="carbadge">🚗</div><h2>ÖTV Muaf Araçlar</h2><div class="sub">Güncel liste fiyatları ve tahmini ÖTV muaf fiyatlar</div></div><div class="check"><small>Son fiyat kontrolü</small><b id="heroTime">—</b></div></div><div class="herofoot"><div><small>Uygun paket</small><b id="heroCount">—</b></div><div><small>Marka</small><b id="heroBrands">—</b></div></div><button onclick="openPage(\'otv\')">Tümünü Gör ›</button></div><div class="sec"><h3>Projeler</h3></div>'
          if old_html not in s:
              raise SystemExit('HTML target not found')
          s=s.replace(old_html,new_html,1)
          old_js="function renderHome(){document.getElementById('heroCount').textContent=(otvData.vehicles||[]).length+' paket';document.getElementById('heroTime').textContent=otvData.updated_time||'—'}"
          new_js="function renderHome(){document.getElementById('heroCount').textContent=(otvData.vehicles||[]).length+' paket';document.getElementById('heroBrands').textContent=allBrands().length+' marka';document.getElementById('heroTime').textContent=otvData.updated_time||'—'}"
          if old_js not in s:
              raise SystemExit('JS target not found')
          s=s.replace(old_js,new_js,1)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/rdv-ui-refresh.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add excel_vlookup_api.py
          git commit -m "Refresh RDV home UI without changing tools"
          git push
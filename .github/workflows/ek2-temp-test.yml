name: Temporary EK-2 verification
on:
  pull_request:
    branches: [main]
    paths:
      - "ek2-balthazard/**"
      - ".github/workflows/ek2-temp-test.yml"
  push:
    branches: ["feature/ek2-arac1-main-temiz"]
    paths:
      - "ek2-balthazard/**"
      - ".github/workflows/ek2-temp-test.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test shared engine
        run: python -X utf8 -m unittest discover -s ek2-balthazard -p "test_balthazard_motoru.py" -v
      - name: Test catalog reader
        run: python -X utf8 -m unittest discover -s ek2-balthazard -p "test_katalog_okuyucu.py" -v
      - name: Test tool 1 server and UI
        working-directory: ek2-balthazard/arac1
        run: |
          python -X utf8 -m unittest -v test_arac1
          python -X utf8 -m unittest -v test_arac1_arayuz
      - name: Test tool 2
        working-directory: ek2-balthazard/arac2
        run: python -X utf8 -m unittest -v test_arac2

name: TUFE Arama Testi

on:
  workflow_dispatch:

jobs:
  test-search:
    runs-on: ubuntu-latest

    steps:
      - name: Bing uzerinden resmi TUİK sonucunu ara
        shell: python
        run: |
          import re
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET

          query = (
              'site:veriportali.tuik.gov.tr '
              '"Tüketici Fiyat Endeksi" '
              '"on iki aylık ortalamalara göre"'
          )

          url = (
              "https://www.bing.com/search?"
              + urllib.parse.urlencode({
                  "q": query,
                  "format": "rss"
              })
          )

          print("ARAMA ADRESI:")
          print(url)
          print()

          req = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept-Language": "tr-TR,tr;q=0.9"
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              print("HTTP CODE:", response.status)
              data = response.read()

          root = ET.fromstring(data)

          items = root.findall(".//item")

          print("SONUC SAYISI:", len(items))
          print()

          found = False

          for index, item in enumerate(items[:10], start=1):
              title = item.findtext("title") or ""
              link = item.findtext("link") or ""
              description = item.findtext("description") or ""

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  description
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()

              print("----- SONUC", index, "-----")
              print("BASLIK:", title)
              print("LINK:", link)
              print("ACIKLAMA:", text[:1000])
              print()

              if (
                  "veriportali.tuik.gov.tr" in link
                  and "Tüketici Fiyat Endeksi" in title
              ):
                  rate_match = re.search(
                      r"on iki aylık ortalamalara göre\s*%?\s*([0-9]+[,.][0-9]+)",
                      text,
                      re.IGNORECASE
                  )

                  period_match = re.search(
                      r"(Ocak|Şubat|Mart|Nisan|Mayıs|Haziran|Temmuz|Ağustos|Eylül|Ekim|Kasım|Aralık)\s+(20\d{2})",
                      title + " " + text,
                      re.IGNORECASE
                  )

                  if rate_match:
                      print("=== ESLESME BULUNDU ===")
                      print(
                          "12 AYLIK ORTALAMA:",
                          rate_match.group(1)
                      )

                      if period_match:
                          print(
                              "DONEM:",
                              period_match.group(1),
                              period_match.group(2)
                          )

                      print(
                          "RESMI KAYNAK:",
                          link
                      )

                      found = True
                      break

          if not found:
              print(
                  "Resmi TUİK sonucundan oran otomatik yakalanamadi."
              )

name: RDV OTV Daily Update

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/otv-daily.yml'
      - 'otv_service.py'
      - 'excel_vlookup_api.py'

jobs:
  refresh-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check RDV Asistan home
        run: |
          set -e
          html=$(curl --fail --silent --show-error --retry 4 --retry-delay 15 --max-time 60 https://mobilrs-test-987996487997.europe-west1.run.app/)
          echo "$html" | grep -q 'ÖTV Muaf Araçlar'
          ! echo "$html" | grep -q 'Hesaplanmıyor'
          ! echo "$html" | grep -qi 'fiyat doğrulanıyor'
          ! echo "$html" | grep -q '>Kontrol<'
          echo "Cloud Run verified-only UI OK"

      - name: Haber otomasyonunu kontrol et
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          response=$(curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/rsever-source/mobilrs/actions/workflows/news-cron.yml/runs?per_page=1")
          python - <<'PY' "$response"
          import json, sys
          from datetime import datetime, timezone
          data=json.loads(sys.argv[1])
          runs=data.get("workflow_runs") or []
          assert runs, "Haber workflow'u için hiç çalışma bulunamadı."
          run=runs[0]
          assert run.get("status") == "completed", f"Son haber çalışması tamamlanmamış: {run.get('status')}"
          assert run.get("conclusion") == "success", f"Son haber çalışması başarısız: {run.get('conclusion')}"
          started=run.get("run_started_at") or run.get("created_at")
          dt=datetime.fromisoformat(started.replace("Z","+00:00"))
          age_hours=(datetime.now(timezone.utc)-dt).total_seconds()/3600
          assert age_hours <= 4, f"Son başarılı haber güncellemesi çok eski: {age_hours:.1f} saat"
          print(f"Haber otomasyonu OK: son başarılı çalışma {age_hours:.1f} saat önce ({run.get('html_url')})")
          PY

      - name: Refresh official OTV data
        run: |
          set -e
          response=$(curl --fail --silent --show-error --retry 4 --retry-delay 15 --max-time 120 -X POST https://mobilrs-test-987996487997.europe-west1.run.app/api/otv/yenile)
          echo "$response" > /tmp/otv.json
          python - <<'PY'
          import json
          with open('/tmp/otv.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('limit') == 2873900, data
          assert data.get('source_mode') == 'ministry_package_live', data
          assert not data.get('refresh_error'), data.get('refresh_error')
          assert data.get('ministry_source'), data
          vehicles=data.get('vehicles') or []
          assert vehicles, 'verified vehicle list is empty'
          assert all(v.get('trim') for v in vehicles), vehicles
          assert all(0 < int(v.get('price', 0)) <= data['limit'] for v in vehicles), vehicles
          assert all(float(v.get('locality', 0)) >= 40 for v in vehicles), vehicles
          assert all('sanayi.gov.tr' in str(v.get('locality_source_url','')) for v in vehicles), vehicles
          assert all(str(v.get('source_url','')).startswith('https://') for v in vehicles), vehicles
          print('OTV package refresh OK:', len(vehicles), 'packages', data.get('updated_at'))
          print('Unresolved:', data.get('unresolved') or [])
          print('Over limit:', data.get('over_limit') or [])
          for v in vehicles:
              print(v.get('brand'), v.get('model'), v.get('trim'), v.get('price'), 'locality', v.get('locality'))
          PY

      - name: Check read API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 https://mobilrs-test-987996487997.europe-west1.run.app/api/otv > /dev/null
          echo "OTV API OK"
